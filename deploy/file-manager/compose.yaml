name: dbx-opendal

services:
  ftp:
    image: delfer/alpine-ftp-server@sha256:60bb774d8408d9d4d5c74d05d1c086a34ce192c6c1a142ffac268cac0dbc6fac
    environment:
      USERS: "dbx|dbx-password"
      ADDRESS: 127.0.0.1
      MIN_PORT: 21100
      MAX_PORT: 21109
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21100-21109:21100-21109"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "21"]
      interval: 2s
      timeout: 2s
      retries: 30

  sftp:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls232
    environment:
      USER_NAME: dbx
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      PUBLIC_KEY_DIR: /keys
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - ./runtime/sftp/id_ed25519.pub:/keys/id_ed25519.pub:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: dbx-access-key
      MINIO_ROOT_PASSWORD: dbx-secret-key
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://s3:9000 dbx-access-key dbx-secret-key
        mc mb --ignore-existing --region us-east-1 local/dbx
    restart: "no"

  webdav:
    image: bytemark/webdav:2.4
    platform: linux/amd64
    environment:
      AUTH_TYPE: Basic
      USERNAME: dbx
      PASSWORD: dbx-password
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x httpd >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  namenode:
    image: apache/hadoop:3.4.3
    platform: linux/amd64
    hostname: namenode
    command:
      - bash
      - -ec
      - |
        hdfs namenode -format -force -nonInteractive
        exec hdfs namenode
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:9870:9870"
    volumes:
      - ./config/hadoop/server/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/server/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9870/jmx"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  datanode:
    image: apache/hadoop:3.4.3
    platform: linux/amd64
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "127.0.0.1:9866:9866"
      - "127.0.0.1:9864:9864"
    volumes:
      - ./config/hadoop/server/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/server/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9864/jmx"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
